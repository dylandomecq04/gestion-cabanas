name: Build and deploy container to Azure Container Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_APP_NAME: sidhartacabanias-app
  RESOURCE_GROUP: rg-cabanas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: 'Production'
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ needs.build-and-push.outputs.image }}

      # "az containerapp update" devuelve OK apenas se crea la revisión nueva; si esa revisión
      # después no arranca, Azure deja el tráfico en la anterior y el deploy parece exitoso.
      # Acá esperamos a que la revisión nueva quede lista y, si no, fallamos mostrando por qué.
      - name: Wait for the new revision to be ready
        uses: azure/CLI@v2
        with:
          inlineScript: |
            APP=${{ env.CONTAINER_APP_NAME }}
            RG=${{ env.RESOURCE_GROUP }}

            REVISION=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestRevisionName -o tsv)
            echo "Esperando la revisión $REVISION"

            for i in $(seq 1 30); do
              LISTA=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName -o tsv)
              ESTADO=$(az containerapp revision show --name "$APP" --resource-group "$RG" --revision "$REVISION"                 --query "properties.runningState" -o tsv)
              echo "[$i/30] última lista: $LISTA | $REVISION: $ESTADO"

              if [ "$LISTA" = "$REVISION" ]; then
                echo "La revisión $REVISION está lista y recibe el tráfico."
                exit 0
              fi
              if [ "$ESTADO" = "ActivationFailed" ]; then
                break
              fi
              sleep 10
            done

            echo "::error::La revisión $REVISION no quedó lista. El tráfico sigue en $LISTA."
            az containerapp revision list --name "$APP" --resource-group "$RG" -o table || true

            # Sin réplica no hay log stream: los logs del arranque fallido se leen de Log Analytics
            # (tardan un rato en aparecer, por eso la espera).
            ENV_ID=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.environmentId -o tsv)
            WORKSPACE=$(az containerapp env show --ids "$ENV_ID" --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv || true)
            if [ -n "$WORKSPACE" ]; then
              sleep 90
              echo "----- Eventos del sistema para $REVISION -----"
              az monitor log-analytics query --workspace "$WORKSPACE" -o tsv                 --analytics-query "ContainerAppSystemLogs_CL | where RevisionName_s == '$REVISION' | order by TimeGenerated asc | project TimeGenerated, Reason_s, Log_s | take 50" || true
              echo "----- Logs de la aplicación para $REVISION -----"
              az monitor log-analytics query --workspace "$WORKSPACE" -o tsv                 --analytics-query "ContainerAppConsoleLogs_CL | where RevisionName_s == '$REVISION' | order by TimeGenerated asc | project TimeGenerated, Log_s | take 100" || true
            else
              echo "El entorno no envía logs a Log Analytics; mirá los logs de la revisión en el portal de Azure."
            fi
            exit 1
